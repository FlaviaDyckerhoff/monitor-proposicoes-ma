name: Monitor Proposições MA

on:
  schedule:
    - cron: '12 8 * * 1-5'   # 05:12 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node monitor.js
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          CONTROLE03_API_USER: ${{ secrets.CONTROLE03_API_USER }}
          CONTROLE03_API_PASS: ${{ secrets.CONTROLE03_API_PASS }}
          CONTROLE03_STATE_URL: ${{ secrets.CONTROLE03_STATE_URL }}
      - name: Salvar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || git commit -m "chore: atualiza estado [skip ci]"
          git push
